<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img"><title>Accuracy per evaluation run</title><desc>Routing and mean field accuracy for the baseline, v2 and v3 dev runs and the holdout run.</desc><style>
  .surface { fill: #fcfcfb; } .ink { fill: #0b0b0b; } .muted { fill: #52514e; }
  .grid { stroke: #e4e3df; } .axis { stroke: #b5b3ad; }
  .s1 { fill: #2a78d6; stroke: #2a78d6; } .s2 { fill: #eb6834; stroke: #eb6834; }
  .ring { stroke: #fcfcfb; } .ref { stroke: #52514e; }
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; } .ink { fill: #f0efec; } .muted { fill: #c3c2b7; }
    .grid { stroke: #33332f; } .axis { stroke: #5c5b55; }
    .s1 { fill: #3987e5; stroke: #3987e5; } .s2 { fill: #d95926; stroke: #d95926; }
    .ring { stroke: #1a1a19; } .ref { stroke: #c3c2b7; }
  }
</style><rect class="surface" width="720" height="360" rx="8"/><text class="ink" x="70" y="28" font-size="16" font-weight="600">Accuracy per evaluation run</text><text class="muted" x="70" y="46" font-size="12">Axis starts at 95%. Dev runs tune prompts; holdout was run once, never tuned on.</text><line class="grid" x1="70" x2="570" y1="290.0" y2="290.0" stroke-width="1"/><text class="muted" x="62" y="294.0" font-size="11" text-anchor="end">95%</text><line class="grid" x1="70" x2="570" y1="248.0" y2="248.0" stroke-width="1"/><text class="muted" x="62" y="252.0" font-size="11" text-anchor="end">96%</text><line class="grid" x1="70" x2="570" y1="206.0" y2="206.0" stroke-width="1"/><text class="muted" x="62" y="210.0" font-size="11" text-anchor="end">97%</text><line class="grid" x1="70" x2="570" y1="164.0" y2="164.0" stroke-width="1"/><text class="muted" x="62" y="168.0" font-size="11" text-anchor="end">98%</text><line class="grid" x1="70" x2="570" y1="122.0" y2="122.0" stroke-width="1"/><text class="muted" x="62" y="126.0" font-size="11" text-anchor="end">99%</text><line class="grid" x1="70" x2="570" y1="80.0" y2="80.0" stroke-width="1"/><text class="muted" x="62" y="84.0" font-size="11" text-anchor="end">100%</text><text class="ink" x="132.5" y="312" font-size="12" text-anchor="middle">Baseline</text><text class="muted" x="132.5" y="327" font-size="12" text-anchor="middle">(dev)</text><circle class="s1 ring" cx="123.5" cy="219.9" r="6" stroke-width="2"><title>Baseline: routing 96.7%</title></circle><path class="s2 ring" d="M141.5 90.6 L148.5 97.6 L141.5 104.6 L134.5 97.6 Z" stroke-width="2"><title>Baseline: fields 99.6%</title></path><text class="ink" x="257.5" y="312" font-size="12" text-anchor="middle">v2 fixes</text><text class="muted" x="257.5" y="327" font-size="12" text-anchor="middle">(dev)</text><circle class="s1 ring" cx="248.5" cy="80.0" r="6" stroke-width="2"><title>v2 fixes: routing 100.0%</title></circle><path class="s2 ring" d="M266.5 107.9 L273.5 114.9 L266.5 121.9 L259.5 114.9 Z" stroke-width="2"><title>v2 fixes: fields 99.2%</title></path><text class="ink" x="382.5" y="312" font-size="12" text-anchor="middle">v3</text><text class="muted" x="382.5" y="327" font-size="12" text-anchor="middle">(dev)</text><circle class="s1 ring" cx="373.5" cy="80.0" r="6" stroke-width="2"><title>v3: routing 100.0%</title></circle><path class="s2 ring" d="M391.5 73.0 L398.5 80.0 L391.5 87.0 L384.5 80.0 Z" stroke-width="2"><title>v3: fields 100.0%</title></path><text class="ink" x="507.5" y="312" font-size="12" text-anchor="middle">Holdout</text><text class="muted" x="507.5" y="327" font-size="12" text-anchor="middle">(unseen)</text><circle class="s1 ring" cx="498.5" cy="80.0" r="6" stroke-width="2"><title>Holdout: routing 100.0%</title></circle><path class="s2 ring" d="M516.5 125.5 L523.5 132.5 L516.5 139.5 L509.5 132.5 Z" stroke-width="2"><title>Holdout: fields 98.8%</title></path><text class="ink" x="531.5" y="72.0" font-size="12">Routing 100%</text><text class="ink" x="531.5" y="146.5" font-size="12">Fields 98.8%</text><circle class="s1" cx="590" cy="90" r="6"/><text class="ink" x="602" y="94" font-size="12">Routing accuracy</text><path class="s2" d="M590 107 L597 114 L590 121 L583 114 Z"/><text class="ink" x="602" y="118" font-size="12">Field accuracy</text></svg>
